services:
  nginx:
    image: nginx:1.27-alpine
    container_name: webapp_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped
    networks:
      - webapp

  # Build del frontend React (Vite) in modalità watch: rigenera frontend/dist a ogni modifica
  node:
    image: node:22-alpine
    container_name: webapp_node
    user: node   # uid 1000: i file generati (node_modules, dist) restano dell'utente host
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build -- --watch"
    restart: unless-stopped
    networks:
      - webapp

  # Test nel browser (Playwright). Non parte con "up": docker compose run --rm e2e
  e2e:
    image: mcr.microsoft.com/playwright:v1.49.1-noble   # versione = @playwright/test in package.json
    container_name: webapp_e2e
    profiles: ["test"]
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      BASE_URL: http://nginx
      HOME: /tmp
    command: npx playwright test
    depends_on:
      - nginx
    ipc: host
    networks:
      - webapp

  php:
    build:
      context: ./docker/php
    container_name: webapp_php
    volumes:
      - ./backend:/var/www/backend
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webapp

  mariadb:
    image: mariadb:11.4
    container_name: webapp_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - webapp

volumes:
  mariadb_data:

networks:
  webapp:
    driver: bridge
